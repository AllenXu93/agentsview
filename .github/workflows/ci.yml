name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nilaway-cold-cache:
    runs-on: namespace-profile-linux-4cpu
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, precompile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Use empty caches
        run: |
          echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/go-mod" >> "$GITHUB_ENV"
          echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci" >> "$GITHUB_ENV"
          echo 'GOPROXY=https://proxy.golang.org|direct' >> "$GITHUB_ENV"
      - name: Prepare lint tools
        run: |
          make sqlite-vec-header
          echo "CGO_CFLAGS=-O2 -g -I$GITHUB_WORKSPACE/.sqlite-include" >> "$GITHUB_ENV"
          make lint-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Precompile package exports
        if: matrix.mode == 'precompile'
        run: make --eval 'nilaway-exports: pricing-snapshot ensure-embed-dir nilaway-golangci-build; /usr/bin/time -v go list -export ./... > /dev/null' nilaway-exports
      - name: Run NilAway
        run: /usr/bin/time -v make nilaway
