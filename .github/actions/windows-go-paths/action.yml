name: Prepare Windows Go paths
description: >-
  Put Go's build and module caches and temporary files on the runner's temp
  drive. Every Windows job that restores or saves a Go cache uses these paths,
  because a cache only restores into the paths it was saved from.
runs:
  using: composite
  steps:
    - name: Set cache and temporary paths
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($name in @('GOCACHE', 'GOMODCACHE', 'TMP', 'TEMP')) {
          $path = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $path | Out-Null
          "$name=$path" >> $env:GITHUB_ENV
        }
